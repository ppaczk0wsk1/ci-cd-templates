  #         # Dramatically speeds up rebuilds when only a few layers change.
  #         # "mode=max" caches ALL layers, not just the final image layers.
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max

  # +-----------------------------------------------------------------------+
  # | DEPLOY (optional - uncomment and customize)                           |
  # +-----------------------------------------------------------------------+
