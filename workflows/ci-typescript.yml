  #         # ssh deploy@server "cd /app && git pull && npm run build"

  # +-----------------------------------------------------------------------+
  # | RELEASE (optional - triggered by pushing a version tag)               |
  # | Example: git tag v1.2.3 && git push --tags                           |
  # +-----------------------------------------------------------------------+
