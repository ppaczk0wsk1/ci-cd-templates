# ============================================================================
# Python CI/CD
# ============================================================================
# Copy to: .github/workflows/ci.yml
# Covers: lint (ruff), type check (mypy), test (pytest + coverage),
#         Docker, deploy, PyPI publish, release.
# ============================================================================

# The display name shown in the GitHub Actions tab.
name: CI/CD

# +-------------------------------------------------------------------------+
# | TRIGGERS                                                                |
# +-------------------------------------------------------------------------+
on:
  # Run on pushes to these branches.
  push:
    branches: [main, master, develop]

  # Run on pull requests targeting these branches.
  pull_request:
    branches: [main, master, develop]

  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# +-------------------------------------------------------------------------+
# | CONCURRENCY                                                             |
# +-------------------------------------------------------------------------+
concurrency:
  # Group by workflow + branch. Cancels stale runs on the same branch/PR.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # +-----------------------------------------------------------------------+
  # | CI - lint, type check, test                                           |
  # +-----------------------------------------------------------------------+
  ci:
    runs-on: ubuntu-latest

    # -- Matrix strategy ---------------------------------------------------
    # Test against multiple Python versions in parallel.
    strategy:
      # Don't cancel other versions if one fails.
      fail-fast: false

      matrix:
        # 3.11 = widely deployed, 3.12 = current stable, 3.13 = latest.
        # Quoted because YAML treats 3.10 as the number 3.1 without quotes.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Check out your repo's code onto the runner.
      - uses: actions/checkout@v6

      # Install the Python version from the matrix.
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          # Which Python version to install.
          python-version: ${{ matrix.python-version }}

          # Cache pip's download cache between runs.
          # Uses the hash of requirements.txt as the cache key.
          cache: "pip"

      # Install project dependencies.
      # "2>/dev/null || true" on the dev requirements means:
      # try to install, but don't fail if the file doesn't exist.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt 2>/dev/null || true

      # Lint with ruff - an extremely fast Python linter (written in Rust).
      # "ruff check" finds errors, "ruff format --check" verifies formatting
      # without changing files (exits non-zero if formatting is off).
      # Configure via ruff.toml or [tool.ruff] in pyproject.toml.
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .
          ruff format --check .

      # Type check with mypy - catches type errors before runtime.
      # --ignore-missing-imports: don't error on untyped third-party libs.
      # "|| true": don't fail the build on type errors (remove this once
      # your codebase is fully typed and you want to enforce it).
      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy . --ignore-missing-imports || true

      # Run tests with pytest.
      # --tb=short:       shorter traceback format (easier to read in CI)
      # -q:               quiet mode (less verbose output)
      # --cov:            measure code coverage
      # --cov-report=xml: output coverage in XML format (for Codecov upload)
      - name: Test (pytest)
        run: |
          pip install pytest pytest-cov
          pytest --tb=short -q --cov --cov-report=xml

      # -- Upload build artifact (optional) ------------------------------------
      # Uncomment to build and upload a Python package (wheel + sdist) as a
      # downloadable artifact. Go to Actions tab -> click the run ->
      # "Artifacts" to download it.
      # Useful for testing a package before publishing to PyPI, or sharing
      # with QA for manual installation (pip install ./mypackage-1.0.0.whl).
      # Requires a pyproject.toml with [build-system] configured.
      # Uploads only from one matrix version to avoid duplicates.
      #
      # - name: Build package
      #   if: matrix.python-version == '3.12'
      #   run: |
      #     pip install build
      #     python -m build
      #
      # - name: Upload build artifact
      #   if: matrix.python-version == '3.12'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: package-${{ github.sha }}
      #     path: dist/
      #     retention-days: 30
      #     if-no-files-found: error

      # -- Upload coverage (optional) --------------------------------------
      # Uncomment to send coverage to Codecov. Add CODECOV_TOKEN to secrets.
      #
      # - name: Upload coverage
      #   # Only upload for one Python version to avoid duplicates.
      #   if: matrix.python-version == '3.12'
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: coverage.xml        # the XML file pytest-cov generated
      #     token: ${{ secrets.CODECOV_TOKEN }}

      # -- Security audit (optional) -------------------------------------------
      # Uncomment to check installed packages for known vulnerabilities.
      # pip-audit checks against the Python Packaging Advisory Database and
      # the OSV (Open Source Vulnerabilities) database.
      # Maintained by Trail of Bits with support from Google.
      # --strict: return a non-zero exit code if any vulnerabilities are found.
      # --desc:   include vulnerability descriptions in the output.
      #
      # - name: Security audit (pip-audit)
      #   run: |
      #     pip install pip-audit
      #     pip-audit --strict --desc

  # +-----------------------------------------------------------------------+
  # | DEPENDENCY REVIEW (optional - runs on pull requests only)             |
  # | Flags new vulnerabilities and license issues introduced by a PR.      |
  # | Compares the PR's dependency changes against the base branch.         |
  # +-----------------------------------------------------------------------+
