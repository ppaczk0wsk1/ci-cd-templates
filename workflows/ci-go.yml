# ============================================================================
# Go CI/CD
# ============================================================================
# Copy to: .github/workflows/ci.yml
# Covers: lint, vet, test (race detection + coverage), build, cross-compile,
#         Docker, deploy, release with attached binaries.
# ============================================================================

# The display name shown in the GitHub Actions tab.
name: CI/CD

# +-------------------------------------------------------------------------+
# | TRIGGERS                                                                |
# +-------------------------------------------------------------------------+
on:
  # Run on pushes to these branches.
  push:
    branches: [main, master, develop]

  # Run on pull requests targeting these branches.
  pull_request:
    branches: [main, master, develop]

  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# +-------------------------------------------------------------------------+
# | CONCURRENCY                                                             |
# +-------------------------------------------------------------------------+
concurrency:
  # Group by workflow + branch. If a new push arrives, cancel the old run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# +-------------------------------------------------------------------------+
# | ENVIRONMENT VARIABLES                                                   |
# | Available to every job. Centralizes version config in one place.        |
# +-------------------------------------------------------------------------+
env:
  # Pin the Go version here so all jobs use the same one.
  # setup-go also reads go.mod's "toolchain" directive if present.
  GO_VERSION: "1.24"

jobs:
  # +-----------------------------------------------------------------------+
  # | CI - lint, vet, test, build                                           |
  # +-----------------------------------------------------------------------+
  ci:
    runs-on: ubuntu-latest

    steps:
      # Check out your repo's code onto the runner.
      - uses: actions/checkout@v6

      # Install Go. setup-go also caches the module download cache
      # and build cache automatically (no extra config needed).
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Run golangci-lint - a fast, parallel linter that bundles dozens of
      # Go linters (staticcheck, errcheck, gosimple, etc.) into one tool.
      # Configure it with a .golangci.yml file in your repo root.
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          # "latest" always pulls the newest golangci-lint release.
          # Pin to a specific version (e.g., "v1.61") for reproducibility.
          version: latest

      # "go vet" is Go's built-in static analyzer. It catches subtle bugs
      # that the compiler doesn't flag (e.g., printf format mismatches,
      # unreachable code, incorrect struct tags).
      - name: Vet
        run: go vet ./...

      # Run all tests in all packages.
      # -race:            enables the race detector (finds data races)
      # -coverprofile:    writes coverage data to a file
      # -covermode=atomic: accurate coverage even with concurrent tests
      # ./...:            test all packages recursively
      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # Print a coverage summary table to the workflow log.
      # Shows coverage percentage per function - useful for quick review.
      - name: Print coverage
        run: go tool cover -func=coverage.out

      # -- Upload coverage (optional) --------------------------------------
      # Uncomment to send coverage to Codecov. Add CODECOV_TOKEN to secrets.
      #
      # - name: Upload coverage
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: coverage.out     # the file we generated above
      #     token: ${{ secrets.CODECOV_TOKEN }}

      # Build the project. This catches compile errors that tests might miss
      # (e.g., files with build tags that exclude them from tests).
      # -v: verbose output showing which packages are being compiled.
      - name: Build
        run: go build -v ./...

      # -- Upload build artifact (optional) ------------------------------------
      # Uncomment to upload the compiled binary as a downloadable artifact.
      # Go to Actions tab -> click the run -> "Artifacts" to download it.
      # Useful for testing a specific build or sharing with QA.
      #
      # Note: "go build ./..." checks all packages but doesn't produce a
      # single binary. To get a downloadable binary, build your main
      # package with -o. Change "./cmd/myapp" to your main package path.
      # This uploads a linux/amd64 binary (the runner's OS/arch).
      # For multi-platform binaries, use the cross-compile job below instead.
      #
      # - name: Build binary
      #   run: go build -v -o myapp ./cmd/myapp
      #
      # - name: Upload build artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: myapp-linux-amd64-${{ github.sha }}
      #     path: myapp
      #     retention-days: 30
      #     if-no-files-found: error

      # -- Security audit (optional) -------------------------------------------
      # Uncomment to scan for known vulnerabilities with govulncheck.
      # govulncheck is Go's official vulnerability scanner. Unlike generic
      # dependency scanners, it uses static analysis to check if vulnerable
      # code is actually *reachable* from your program. This means fewer
      # false positives - it only reports vulnerabilities you can actually hit.
      # Install it fresh each run to get the latest vulnerability database.
      #
      # - name: Security audit (govulncheck)
      #   run: |
      #     go install golang.org/x/vuln/cmd/govulncheck@latest
      #     govulncheck ./...

  # +-----------------------------------------------------------------------+
  # | DEPENDENCY REVIEW (optional - runs on pull requests only)             |
  # | Flags new vulnerabilities and license issues introduced by a PR.      |
  # | Compares the PR's dependency changes against the base branch.         |
  # +-----------------------------------------------------------------------+
